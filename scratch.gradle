buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath group: 'org.gradlefx', name: 'gradlefx', version: '1.5.0'
    }
}

repositories {
    mavenCentral()
    ivy {
        name 'Apache Flex'
        artifactPattern 'https://archive.apache.org/dist/flex/[revision]/binaries/[module]-[revision]-bin.[ext]'
    }
    ivy {
        name 'Player Globals'
        artifactPattern 'https://raw.githubusercontent.com/nexussays/playerglobal/fef560243029214656d83fc673be0267a1ea0816/[revision]/[artifact].[ext]'
    }
}

apply plugin: org.gradlefx.plugins.GradleFxPlugin

ext.getCommitID = { repository ->
    def dirty = "git status --porcelain --ignore-submodules=dirty".execute(null, file(repository)).text.trim() ? "-dirty" : ""
    def revision = "git rev-parse --short HEAD".execute(null, file(repository)).text.trim()
    return revision ? revision + dirty : 'unknown'
}

def commonDir = ext.commonDir
def target = hasProperty('target') ? target : '11.6'
println "Target is: $target"
def config = new ConfigSlurper(target).parse(file("${commonDir}/config.groovy").toURL())

type = 'mobile'
version = '1.0-SNAPSHOT'
frameworkLinkage = 'none'
buildDir = "${buildDir}/${target}" // GradleFX does an out-of-date check on the whole build dir
output = config.get('output')
playerVersion = config.get('playerVersion')

def scratchFlashCommitID = getCommitID(commonDir)
println "Commit ID for scratch-flash is: ${scratchFlashCommitID}"

dependencies {
    flexSDK group: 'org.apache', name: 'apache-flex-sdk', version: '4.15.0', ext: 'zip'
    external group: 'macromedia.com', name: 'playerglobal', version: playerVersion, ext: 'swc'
    merged files(
            "${commonDir}/libs/as3corelib.swc",
            "${commonDir}/libs/blooddy_crypto.swc",
            "${commonDir}/libs/grabcut.swc"

    )
}

sdkAutoInstall {
    showPrompts = false
}

additionalCompilerOptions = [
        "-library-path+=libs/framework.swc", // in the SDK's frameworks directory
        "-library-path+=libs/osmf.swc", // in the SDK's frameworks directory
        "-target-player=${playerVersion}",
        "-default-size=800,600",
        "-define+=SCRATCH::revision,'${scratchFlashCommitID}'",
        "-advanced-telemetry",
]
additionalCompilerOptions += config.get('additionalCompilerOptions')

build.dependsOn compileFlex

def mediaSourceDir = file(findProperty('mediaDir') ?: "${commonDir}/media")
def defaultMediaArchive = file("${commonDir}/build/downloads/Scratch-461.air")
def mediaArchiveFile = findProperty('mediaArchive') ? file(property('mediaArchive')) :
    (!project.hasProperty('mediaDir') && defaultMediaArchive.isFile() ? defaultMediaArchive : null)
task bundleMedia(dependsOn: compileFlex) {
    inputs.files(mediaArchiveFile ? files(mediaArchiveFile) : fileTree(mediaSourceDir))
    outputs.dir "${buildDir}/media"
    doLast {
        def sourceDir = mediaSourceDir
        if (mediaArchiveFile) {
            if (!mediaArchiveFile.isFile()) {
                throw new GradleException("Media archive not found: ${mediaArchiveFile}")
            }
            sourceDir = new File(temporaryDir, 'media')
            project.sync {
                into sourceDir
                includeEmptyDirs = false
                from(zipTree(mediaArchiveFile)) {
                    include 'media/libs/*Library.json', 'media/*'
                    eachFile { details ->
                        if (details.path.startsWith('media/libs/') ||
                                details.name ==~ /[0-9a-f]+\.[A-Za-z0-9]+/ ||
                                details.name == 'README.md' ||
                                details.name.startsWith('LICENSE') || details.name.startsWith('COPYING')) {
                            details.path = details.path.substring('media/'.length())
                        } else {
                            details.exclude()
                        }
                    }
                }
            }
        }
        if (!sourceDir.isDirectory()) {
            if (project.hasProperty('mediaDir')) {
                throw new GradleException("Media directory not found: ${sourceDir}")
            }
            logger.lifecycle('No offline media bundle found. See the Offline Media section in README.md.')
            return
        }
        if (!new File(sourceDir, 'libs/spriteLibrary.json').isFile()) {
            throw new GradleException('Offline media must contain libs/spriteLibrary.json')
        }
        def checkedAssets = [] as Set
        def checkReferences
        checkReferences = { value ->
            if (value instanceof Map) {
                value.each { key, child ->
                    if (key in ['md5', 'baseLayerMD5', 'textLayerMD5'] && child instanceof String && child) {
                        if (!(child ==~ /[A-Za-z0-9_.-]+/) || child in ['.', '..']) {
                            throw new GradleException("Invalid media asset name: ${child}")
                        }
                        def asset = new File(sourceDir, child)
                        if (!asset.isFile()) {
                            throw new GradleException("Missing offline media asset: ${asset}")
                        }
                        if (checkedAssets.add(child) && child.endsWith('.json')) {
                            checkReferences(new groovy.json.JsonSlurper().parse(asset, 'UTF-8'))
                        }
                    } else {
                        checkReferences(child)
                    }
                }
            } else if (value instanceof List) {
                value.each { child -> checkReferences(child) }
            }
        }
        fileTree(new File(sourceDir, 'libs')).matching { include '*Library.json' }.each { library ->
            def text = library.readLines('UTF-8').findAll { line ->
                !line.startsWith('//') && !line.startsWith('<')
            }.join('\n')
            def entries = new groovy.json.JsonSlurper().parseText(text)
            if (!(entries instanceof List)) {
                throw new GradleException("Media library must contain an array: ${library}")
            }
            checkReferences(entries)
        }
        project.sync {
            from sourceDir
            into "${buildDir}/media"
        }
    }
}
build.dependsOn bundleMedia

wrapper {
    gradleVersion = '5.6.4'
}
